<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Trading Journal</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ax:#898781;
  --line:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--pos:#2a78d6;--neg:#e34948;--btn:#2a78d6;
  --gain:#0ca30c;--loss:#e34948;--run:#6250d6;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ax:#898781;
    --line:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
    --s1:#3987e5;--pos:#3987e5;--neg:#e66767;
    --gain:#0ca30c;--loss:#e66767;--run:#9085e9;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--ax:#898781;
  --line:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--pos:#3987e5;--neg:#e66767;
  --gain:#0ca30c;--loss:#e66767;--run:#9085e9;
}
.rgl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{resize:vertical;width:100%}
input[type=checkbox]{width:auto;accent-color:var(--s1)}
button{cursor:pointer}
button:hover{background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 50%,var(--line))}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.brand span{color:var(--s1)}
.badge{border:1px solid var(--line);color:var(--ink2);padding:2px 9px;border-radius:99px;font-size:12px}
#msg{color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--ink2);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:20px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.card .sub{color:var(--ink2);font-size:12px;margin:0 0 10px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2,.grid2e{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:minmax(240px,1fr) 3fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.herocard{display:flex;flex-direction:column;justify-content:center}
.herocard .big{font-size:52px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.herocard .lab{color:var(--ink2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--ink2);font-size:12px}
.kpi .v{font-size:21px;font-weight:650;margin-top:2px;white-space:nowrap}
.kpi .n{color:var(--ink2);font-size:12px;margin-top:1px}
.muted{color:var(--ink2)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--ax);font-size:11px}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);
 box-shadow:0 4px 14px var(--ring);border-radius:8px;padding:7px 10px;font-size:12px;display:none;max-width:260px}
#tip b{display:block;margin-bottom:2px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{color:var(--ink2);font-weight:600;font-size:12px}
th.l,td.l{text-align:left}
td.num,th.num{font-variant-numeric:tabular-nums}
tbody tr.t{cursor:pointer}
tbody tr.t:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
tr.win td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
tr.loss td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:48px;border-radius:6px;padding:4px 6px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
.cal div.h{background:none;min-height:0;text-align:center;padding:0}
.cal b{display:block;font-size:12px;color:var(--ink);margin-top:2px;font-weight:600}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;color:var(--ink2);line-height:20px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--surface);user-select:none}
.chip.on{background:color-mix(in srgb,var(--s1) 16%,var(--surface));border-color:var(--s1);font-weight:600}
.chip.bad.on{background:color-mix(in srgb,var(--neg) 16%,var(--surface));border-color:var(--neg)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg label{position:relative;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--surface);border-left:1px solid var(--line);user-select:none}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:color-mix(in srgb,var(--s1) 16%,var(--surface));font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--s1);outline-offset:-2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{margin-left:auto}
.dbar{position:relative;height:16px;min-width:200px}
.dbar i{position:absolute;top:2px;height:12px;display:block}
.dbar .ax{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--axis)}
.dbar .p{left:50%;background:var(--pos);border-radius:0 4px 4px 0}
.dbar .n{right:50%;background:var(--neg);border-radius:4px 0 0 4px}
.ins{padding:10px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins b{font-weight:650}
.chipx{display:inline-block;margin-left:6px;border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--ink2)}
.empty{padding:36px 16px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin:0 0 6px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}
#scrim.on{display:block}
#drawer{position:fixed;top:0;right:0;width:min(660px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);
 transform:translateX(105%);transition:transform .18s;overflow:auto;z-index:10;padding:0 20px 90px}
#drawer.open{transform:none}
.dhead{position:sticky;top:0;background:var(--surface);padding:16px 0 10px;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead h2{margin:0;font-size:19px}
.stat6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin:12px 0}
.stat6 div span{display:block;color:var(--ink2);font-size:11px}
.sec{padding:14px 0 4px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;margin-bottom:10px}
.fg label,.fl{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.fg input,.fg select{width:100%}
.wide{margin-bottom:10px}
.wide input{width:100%}
.cl h4{margin:8px 0 4px;font-size:12px;color:var(--ink2)}
.cl label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px;cursor:pointer}
.score{font-weight:650}
.stars span{font-size:24px;cursor:pointer;color:var(--axis);line-height:1}
.stars span.on{color:var(--s1)}
.risk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;background:color-mix(in srgb,var(--ink) 4%,var(--surface));border-radius:8px;padding:10px;margin-bottom:10px}
.risk div span{display:block;font-size:11px;color:var(--ink2)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.imgs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:150px}
.imgs img{display:block;width:100%;height:100px;object-fit:cover}
.imgs figcaption{font-size:11px;padding:2px 6px;color:var(--ink2);display:flex;justify-content:space-between}
.imgs figcaption button{border:0;background:none;padding:0 2px;color:var(--neg);cursor:pointer}
.dfoot{position:fixed;bottom:0;right:0;width:min(660px,100%);background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;z-index:11;transform:translateX(105%);transition:transform .18s}
.dfoot.open{transform:none}
/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:30;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
.pb{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.pb .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:800px){.pb .cols{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.plan:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.plan p{margin:4px 0;white-space:pre-wrap}
.note{background:color-mix(in srgb,var(--s1) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--s1) 35%,var(--line));border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.note.warn{background:color-mix(in srgb,var(--neg) 9%,var(--surface));border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.links a{display:block;font-size:12px;color:var(--s1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Trend<span>Journal</span></div>
  <span class="badge" id="demo" style="display:none">DEMO DATA</span>
  <span id="msg"></span>
  <select id="range" aria-label="Date range">
    <option value="7">Last 7 days</option><option value="30">Last 30 days</option>
    <option value="90">Last 90 days</option><option value="0" selected>All time</option>
  </select>
  <select id="sym" aria-label="Symbol"><option value="">All symbols</option></select>
  <select id="src" aria-label="Source"><option value="">All sources</option></select>
  <button class="btn" id="addbtn">+ Add trade</button>
  <button class="btn pri" id="sync">Sync from exchange</button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="dash" class="on">Dashboard</button>
  <button data-tab="trades">Trades &amp; journal</button>
  <button data-tab="insights">Insights</button>
  <button data-tab="plans">Weekly plan</button>
  <button data-tab="settings">Playbooks &amp; settings</button>
</nav>
<main>
  <div id="notice"></div>

  <section class="tab on" id="tab-dash">
    <div id="dash"></div>
  </section>

  <section class="tab" id="tab-trades">
    <div class="toolbar">
      <button class="btn" id="imp">Import CSV</button>
      <a class="btn" style="text-decoration:none;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink)" href="/api/export.csv">Export CSV</a>
      <label class="muted"><input type="checkbox" id="unj"> Needs journaling only</label>
      <span class="sp muted" id="tcount"></span>
      <input type="file" id="file" accept=".csv,.tsv,text/csv" style="display:none">
    </div>
    <div class="card" style="padding:0"><div class="scroll" id="trades"></div></div>
  </section>

  <section class="tab" id="tab-insights"><div id="insights"></div></section>
  <section class="tab" id="tab-plans"><div id="plans"></div></section>
  <section class="tab" id="tab-settings"><div id="settings"></div></section>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-label="Trade journal"></aside>
<div class="dfoot" id="dfoot"></div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="tip"></div>

<script>
const DEMO = __DEMO__;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (x, d = 2) => x == null ? '–' : Number(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (x, d = 2) => x == null ? '–' : (x < 0 ? '−' : x > 0 ? '+' : '') + '$' + fmt(Math.abs(x), d);
const usd = (x, d = 2) => x == null ? '–' : (x < 0 ? '−' : '') + '$' + fmt(Math.abs(x), d);
const rr = x => x == null ? '–' : (x < 0 ? '−' : '') + fmt(Math.abs(x)) + 'R';
const px = x => x == null ? '–' : +Number(x).toPrecision(7);
const pct = (x, d = 1) => x == null ? '–' : fmt(x, d) + '%';
const dur = s => s == null ? 'open' : s < 3600 ? Math.round(s / 60) + 'm' : s < 86400 ? (s / 3600).toFixed(1) + 'h' : (s / 86400).toFixed(1) + 'd';
const fmtT = ms => ms ? new Date(ms).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : 'open';
const fmtD = ms => new Date(ms).toLocaleDateString([], {month: 'short', day: 'numeric'});
const compact = v => { const a = Math.abs(v); const s = a >= 1e6 ? (a / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : a >= 1e3 ? (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(+a.toFixed(2)); return (v < 0 ? '−' : '') + '$' + s; };
const api = async (url, opt) => { const r = await fetch(url, opt); let j = {}; try { j = await r.json(); } catch (e) {} if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const jpost = (url, body, method = 'POST') => api(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

let S = {data: null, tab: 'dash', cal: new Date(), dim: 'setup', sel: null, views: {eq: 'chart', daily: 'chart'}, unj: false, plans: [], editPlan: null};

// ------------------------------------------------------------------ tooltip
const tip = $('#tip');
function showTip(html, e) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}
const hideTip = () => tip.style.display = 'none';

// ------------------------------------------------------------------ load
async function load() {
  const days = +$('#range').value, since = days ? Date.now() - days * 864e5 : 0;
  const q = new URLSearchParams({since, symbol: $('#sym').value, source: $('#src').value, tz: new Date().getTimezoneOffset()});
  S.data = await api('/api/data?' + q);
  const d = S.data;
  const fillSel = (el, vals, all) => { const cur = el.value; el.innerHTML = `<option value="">${all}</option>` + vals.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join(''); };
  fillSel($('#sym'), d.symbols, 'All symbols'); fillSel($('#src'), d.sources, 'All sources');
  $('#demo').style.display = d.demo ? '' : 'none';
  renderNotice(); renderTab();
  if (d.pending_excursions > 0 && !S.excBusy) runExcursions();
}
async function runExcursions() {
  S.excBusy = true; $('#msg').textContent = 'Computing running P&L…';
  try {
    for (let i = 0; i < 40; i++) { const j = await jpost('/api/excursions', {}); if (!(j.pending > 0)) break; }
  } catch (e) {}
  S.excBusy = false; $('#msg').textContent = '';
  await load2();
}
async function load2() { // reload without re-triggering excursions
  const days = +$('#range').value, since = days ? Date.now() - days * 864e5 : 0;
  S.data = await api('/api/data?' + new URLSearchParams({since, symbol: $('#sym').value, source: $('#src').value, tz: new Date().getTimezoneOffset()}));
  renderTab();
}
function renderNotice() {
  const d = S.data; let h = '';
  if (d.skipped_orphans > 0) h += `<div class="note">${d.skipped_orphans} closing fill(s) belong to positions opened before the synced window, so they were left out. Increase <code>SYNC_DAYS</code> in .env and sync again to include them.</div>`;
  $('#notice').innerHTML = h;
}
function renderTab() {
  ({dash: renderDash, trades: renderTrades, insights: renderInsights, plans: renderPlans, settings: renderSettings})[S.tab]();
}
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.tab; hideTip();
  $$('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $$('.tab').forEach(x => x.classList.toggle('on', x.id === 'tab-' + S.tab));
  renderTab();
};
['range', 'sym', 'src'].forEach(id => $('#' + id).onchange = load);

// ------------------------------------------------------------------ dashboard
function welcome() {
  return `<div class="card empty"><h3>No trades yet</h3>
   <div>Bring your history in, or connect your exchange. Everything stays on this computer.</div>
   <div class="row"><button class="btn pri" onclick="$('#imp').click();$('#tabs button[data-tab=trades]').click()">Import your Google Sheet (CSV)</button>
   <button class="btn" onclick="$('#sync').click()">Sync from Bybit / Binance</button>
   <button class="btn" onclick="$('#addbtn').click()">Add a trade by hand</button></div>
   <p class="muted" style="margin-top:16px;font-size:12px">Sheets: File → Download → Comma-separated values (.csv). Your current "Trend Trading Journal" columns import as they are.</p></div>`;
}
function renderDash() {
  const d = S.data, s = d.stats;
  if (!d.total_trades) { $('#dash').innerHTML = welcome(); return; }
  if (!s.trades) { $('#dash').innerHTML = '<div class="card empty">No closed trades in this range / filter.</div>'; return; }
  const k = (l, v, n = '', t = '') => `<div class="kpi" title="${esc(t)}"><div class="l">${l}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`;
  const unj = d.trades.filter(t => t.status === 'closed' && !t.journaled).length;
  $('#dash').innerHTML = `
  <div class="hero">
    <div class="card herocard" style="margin:0"><div class="lab">Net P&amp;L (after fees &amp; funding)</div>
      <div class="big">${sgn(s.net)}</div>
      <div class="lab">${s.trades} closed trades · gross ${sgn(s.gross)} · fees ${usd(-s.fees)}${s.funding ? ' · funding ' + sgn(s.funding) : ''}</div>
      ${unj ? `<div style="margin-top:10px"><button class="btn sm" id="gounj">${unj} trade${unj > 1 ? 's' : ''} still need journaling →</button></div>` : ''}</div>
    <div class="kpis">
      ${k('Win rate', pct(s.win_rate), `${Math.round(s.win_rate * s.trades / 100)}W / ${s.trades - Math.round(s.win_rate * s.trades / 100)}L`)}
      ${k('Profit factor', s.profit_factor == null ? '∞' : fmt(s.profit_factor), 'gross wins ÷ gross losses')}
      ${k('Expectancy / trade', sgn(s.expectancy), 'average net per trade')}
      ${k('Average R', rr(s.avg_r), s.r_count ? `${s.r_count} trades with a stop recorded` : 'record stop prices to get R', 'Net P&L divided by the risk at your initial stop')}
      ${k('Average win', sgn(s.avg_win), `best ${sgn(s.best)}`)}
      ${k('Average loss', sgn(s.avg_loss), `worst ${sgn(s.worst)}`)}
      ${k('Max drawdown', usd(-s.max_drawdown), 'peak to trough, realised')}

function niceTicks(min, max, n = 4) {
  if (min === max) max = min + 1;
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), norm = step0 / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) t.push(+v.toFixed(10));
  return t;
}

function wireRun(el, T, c) {
  const j = el.querySelector('#rhit'); if (!j) return;
  const svg = el.querySelector('svg'), xh = el.querySelector('#rx'), dot = el.querySelector('#rd');
  const W = svg.viewBox.baseVal.width, H = svg.viewBox.baseVal.height;
  // rebuild the series for hover lookups (same maths as the chart)
  {
    const {pts} = runSeries(T, c), m = {l: 54, r: 18, t: 22, b: 26};
    const x0 = pts[0].t, x1 = pts[pts.length - 1].t, X = t => m.l + (W - m.l - m.r) * (x1 === x0 ? .5 : (t - x0) / (x1 - x0));
    const vals = pts.flatMap(p => [p.c, p.lo, p.hi]).concat([0], T.risk_usd ? [-T.risk_usd] : [], T.planned_tp ? [(T.planned_tp - T.entry_price) * T.qty * (T.side === 'LONG' ? 1 : -1)] : []);
    const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4), ymin = ticks[0], ymax = ticks[ticks.length - 1];
    const Y = v => m.t + (H - m.t - m.b) * (1 - (v - ymin) / ((ymax - ymin) || 1));
    j.onmousemove = e => {
      const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
      let best = 0, bd = 1e18; pts.forEach((p, i) => { const d = Math.abs(X(p.t) - mx); if (d < bd) { bd = d; best = i; } });
      const p = pts[best]; xh.style.display = ''; xh.setAttribute('x1', X(p.t)); xh.setAttribute('x2', X(p.t)); dot.style.display = ''; dot.setAttribute('cx', X(p.t)); dot.setAttribute('cy', Y(p.c));
      showTip(`<b>${fmtT(p.t)}</b>P&amp;L ${sgn(p.c)}${p.lo !== p.hi ? `<br>candle range ${sgn(p.lo)} to ${sgn(p.hi)}` : ''}`, e);
    };
    j.onmouseleave = () => { hideTip(); xh.style.display = 'none'; dot.style.display = 'none'; };
  }
}

   <div class="scroll"><table><thead><tr><th class="l">${esc((s.dims.find(x => x.key === dim) || {}).label)}</th><th>Trades</th><th>Win %</th><th class="l">Net P&amp;L</th><th>Per trade</th><th>Avg R</th></tr></thead><tbody>${
    rows.map(r => `<tr><td class="l">${esc(r.name)}</td><td class="num">${r.trades}</td><td class="num">${r.win_rate}%</td>
     <td class="l"><div style="display:flex;gap:10px;align-items:center"><div class="dbar"><span class="ax"></span><i class="${r.net >= 0 ? 'p' : 'n'}" style="width:${Math.max(2, 50 * Math.abs(r.net) / mx)}%"></i></div><span class="num" style="min-width:76px">${sgn(r.net)}</span></div></td>
     <td class="num">${sgn(r.expectancy)}</td><td class="num">${rr(r.avg_r)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#dim').onchange = e => { S.dim = e.target.value; renderInsights(); };
}

// ------------------------------------------------------------------ settings & playbooks
function lines(a) { return (a || []).join('\n'); }
function renderSettings() {
  const c = S.data.config;
  $('#settings').innerHTML = `
  <div class="card"><h2>Account &amp; risk</h2><p class="sub">Used for balance columns, risk % and risk class. Balance before each trade = starting balance + earlier net P&amp;L (override it per trade after deposits or withdrawals).</p>
   <div class="fg" style="max-width:520px"><div><label>Starting balance (USD)</label>${inp('s-bal', c.starting_balance || '')}</div><div><label>Max risk per trade (%)</label>${inp('s-risk', c.risk_rule_pct)}</div></div></div>
  <div class="card"><div class="cardhead"><div><h2>Playbooks</h2><p class="sub">Your entry, market and exit criteria, one per line. Each trade gets a checklist score against its playbook.</p></div><button class="btn sm" id="addpb">+ Playbook</button></div><div id="pbs"></div></div>
  <div class="grid2e" style="grid-template-columns:repeat(3,1fr)">
   <div class="card"><h2>Setup tags</h2><p class="sub">One per line</p>${area('s-setup', lines(c.setup_tags), 10)}</div>
   <div class="card"><h2>Mistake tags</h2><p class="sub">One per line</p>${area('s-mist', lines(c.mistake_tags), 10)}</div>
   <div class="card"><h2>Exit reasons &amp; timeframes</h2><p class="sub">Exit reasons, then timeframes</p>${area('s-exit', lines(c.exit_reasons), 6)}<div style="height:8px"></div>${area('s-tf', lines(c.timeframes), 3)}</div></div>
  <button class="btn pri" id="ssave">Save settings</button>`;
  S.pbs = JSON.parse(JSON.stringify(c.playbooks)); drawPbs();
  $('#addpb').onclick = () => { collectPbs(); S.pbs.push({id: '', name: 'New playbook', entry: [], market: [], exit: []}); drawPbs(); };
  $('#ssave').onclick = async () => {
    collectPbs(); const v = id => $('#' + id).value, ls = id => v(id).split('\n');
    try {
      await jpost('/api/config', {starting_balance: v('s-bal'), risk_rule_pct: v('s-risk'), setup_tags: ls('s-setup'), mistake_tags: ls('s-mist'), exit_reasons: ls('s-exit'), timeframes: ls('s-tf'), playbooks: S.pbs});
      await load2(); toast('Settings saved');
    } catch (e) { toast(e.message, true); }
  };
}
function drawPbs() {
  $('#pbs').innerHTML = S.pbs.map((p, i) => `<div class="pb" data-i="${i}"><div style="display:flex;gap:8px;margin-bottom:8px"><input class="pn" value="${esc(p.name)}" style="flex:1" aria-label="Playbook name"><button class="btn danger sm pd">Remove</button></div>
   <div class="cols"><div><label class="fl">Entry criteria</label><textarea class="pe" rows="6">${esc(lines(p.entry))}</textarea></div>
   <div><label class="fl">Market conditions</label><textarea class="pm" rows="6">${esc(lines(p.market))}</textarea></div>
   <div><label class="fl">Exit criteria</label><textarea class="px" rows="6">${esc(lines(p.exit))}</textarea></div></div></div>`).join('');
  $$('.pd').forEach(b => b.onclick = () => { collectPbs(); S.pbs.splice(+b.closest('.pb').dataset.i, 1); drawPbs(); });
}
function collectPbs() {
  $$('#pbs .pb').forEach(el => { const p = S.pbs[+el.dataset.i]; p.name = el.querySelector('.pn').value; p.entry = el.querySelector('.pe').value.split('\n'); p.market = el.querySelector('.pm').value.split('\n'); p.exit = el.querySelector('.px').value.split('\n'); });
}

// ------------------------------------------------------------------ weekly plan
function monday() { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10); }
async function renderPlans() {
  S.plans = await api('/api/plans');
  const p = S.editPlan || {week: monday(), symbol: '', bias: 'Unclear', levels: '', worst: '', likely: '', best: '', outcome: ''};
  $('#plans').innerHTML = `
  <div class="grid2" style="grid-template-columns:1fr 1fr">
   <div class="card"><h2>${p.id ? 'Edit plan' : 'New weekly plan'}</h2><p class="sub">Sunday routine: mark the lines and levels, then walk through the worst, likely and best case before the week starts.</p>
    <div class="fg"><div><label>Week of</label>${inp('p-week', p.week, 'date')}</div><div><label>Instrument</label>${inp('p-sym', p.symbol, 'text', 'BTCUSDT')}</div>
     <div><label>Bias</label><select id="p-bias">${opts(['Bullish', 'Bearish', 'Range', 'Unclear'], p.bias, null)}</select></div></div>
    <div class="wide"><label class="fl">Key lines &amp; levels (touches, alerts set)</label>${area('p-levels', p.levels, 3)}</div>
    <div class="wide"><label class="fl">Worst case</label>${area('p-worst', p.worst, 2)}</div>
    <div class="wide"><label class="fl">Likely case</label>${area('p-likely', p.likely, 2)}</div>
    <div class="wide"><label class="fl">Best case</label>${area('p-best', p.best, 2)}</div>
    <div class="wide"><label class="fl">Review — what actually happened</label>${area('p-out', p.outcome, 3)}</div>
    <button class="btn pri" id="psave">Save plan</button> ${p.id ? '<button class="btn" id="pnew">New plan</button> <button class="btn danger" id="pdel">Delete</button>' : ''}</div>
   <div><h2 style="font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px">Past plans</h2>${
    S.plans.map(x => `<div class="plan" data-id="${x.id}"><b>${esc(x.symbol) || 'Plan'}</b> · week of ${esc(x.week)} <span class="tg">${esc(x.bias)}</span>
     ${x.levels ? `<p class="muted">${esc(x.levels)}</p>` : ''}${x.outcome ? `<p><b>Review:</b> ${esc(x.outcome)}</p>` : '<p class="muted">No review yet</p>'}</div>`).join('') || '<div class="muted">No plans yet.</div>'}</div></div>`;
  $$('.plan').forEach(el => el.onclick = () => { S.editPlan = S.plans.find(x => x.id === +el.dataset.id); renderPlans(); });
  $('#psave').onclick = async () => {
    const v = id => $('#' + id).value;
    await jpost('/api/plans', {id: p.id, week: v('p-week'), symbol: v('p-sym').toUpperCase(), bias: v('p-bias'), levels: v('p-levels'), worst: v('p-worst'), likely: v('p-likely'), best: v('p-best'), outcome: v('p-out')});
    S.editPlan = null; renderPlans(); toast('Plan saved');
  };
  $('#pnew') && ($('#pnew').onclick = () => { S.editPlan = null; renderPlans(); });
  $('#pdel') && ($('#pdel').onclick = async () => { await api('/api/plans/' + p.id, {method: 'DELETE'}); S.editPlan = null; renderPlans(); });
}

// ------------------------------------------------------------------ add trade / import / sync
function toast(msg, bad) {
  const el = document.createElement('div'); el.className = 'note' + (bad ? ' warn' : ''); el.textContent = msg;
  $('#notice').prepend(el); setTimeout(() => el.remove(), bad ? 9000 : 3500);
}
$('#addbtn').onclick = () => {
  const now = new Date().toISOString().slice(0, 16);
  $('#modalbox').innerHTML = `<h2 style="margin:0 0 4px;font-size:17px">Add a trade</h2><p class="muted" style="margin:0 0 12px;font-size:12px">For trades that are not on your synced exchange. Times are UTC. Leave the exit blank for an open trade.</p>
   <div class="fg"><div><label>Instrument</label>${inp('m-sym', '', 'text', 'BTCUSDT')}</div><div><label>Side</label><select id="m-side"><option>LONG</option><option>SHORT</option></select></div><div><label>Quantity</label>${inp('m-qty', '')}</div>
   <div><label>Entry time (UTC)</label>${inp('m-et', now, 'datetime-local')}</div><div><label>Entry price</label>${inp('m-ep', '')}</div><div></div>
   <div><label>Exit time (UTC)</label>${inp('m-xt', '', 'datetime-local')}</div><div><label>Exit price</label>${inp('m-xp', '')}</div><div><label>Total fees (USD)</label>${inp('m-fee', '')}</div></div>
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" id="mcancel">Cancel</button><button class="btn pri" id="madd">Add and journal</button></div><div id="merr" class="muted" style="color:var(--neg);margin-top:8px"></div>`;
  $('#modal').classList.add('on');
  $('#mcancel').onclick = () => $('#modal').classList.remove('on');
  $('#madd').onclick = async () => {
    const v = id => $('#' + id).value;
    try {
      const j = await jpost('/api/manual', {symbol: v('m-sym'), side: v('m-side'), qty: v('m-qty'), entry_time: v('m-et'), entry_price: v('m-ep'), exit_time: v('m-xt'), exit_price: v('m-xp'), fees: v('m-fee')});
      $('#modal').classList.remove('on'); $('#range').value = '0'; await load2();
      $('#tabs button[data-tab=trades]').click(); openDrawer(j.id);
    } catch (e) { $('#merr').textContent = e.message; }
  };
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const fd = new FormData(); fd.append('file', f);
  try {
    const j = await api('/api/import', {method: 'POST', body: fd});
    let m = `Imported: ${j.created} new trade(s), ${j.attached} matched to synced trades.`;
    if (j.errors.length) m += ' Skipped: ' + j.errors.join('; ');
    toast(m, j.errors.length > 0); $('#range').value = '0'; await load();
  } catch (err) { toast(err.message, true); }
};
$('#sync').onclick = async () => {
  const b = $('#sync'); b.disabled = true; $('#msg').textContent = 'Syncing…';
  try {
    const j = await jpost('/api/sync', {});
    toast(`Synced ${j.new_fills} new fills from ${j.exchanges.join(' + ')}${j.merged_manual ? `. ${j.merged_manual} imported trade(s) matched to the exchange and merged` : ''}${j.warnings.length ? '. ' + j.warnings.join(' ') : ''}`, j.warnings.length > 0);
    $('#msg').textContent = ''; await load();
  } catch (e) { $('#msg').textContent = ''; toast(e.message, true); }
  b.disabled = false;
};
load().catch(e => toast(e.message, true));
</script>
</body>
</html>
